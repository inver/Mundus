schema: spec-driven

# Project context: only constraints that cannot be inferred by reading the code.
# General documentation lives in AGENTS.md and docs/, discoverable facts are deliberately left out.
context: |
  Mundus is a desktop 3D scene editor (LibGDX + VisUI, Java 11 target, Kotlin only in app-editor).
  Write all artifacts in English.

  Build and verification
  - A change is verified with `./gradlew check`: tests plus checkstyleMain AND checkstyleTest. Test sources are
    checked too. Line length is 120.
  - A change that touches GLSL must also run `./gradlew :lib-core:shaderCheck`. It compiles the shaders for many
    variants and compares rendered pixels in a hidden OpenGL window, so it needs a display and is intentionally not
    part of `check`. Tasks must name it explicitly, because `check` alone will not catch a broken shader.
  - UI and rendering behavior cannot be exercised headless. Requirements for them must say how they are verified
    (a unit test on the presenter or model, the shader check, or an explicit manual step) instead of implying that
    `check` proves them.

  Module rules
  - Checkstyle bans importing the libGDX g3d runtime types (Model, ModelData, ModelBatch, Mesh, MeshPart,
    ModelBuilder, DefaultShader and similar). `lib-core` (`net.nevinsky.abyssus.core`) is the deliberate
    reimplementation: use it. The build fails otherwise (`config/checkstyle/checkstyle.xml`, IllegalImport).
  - New code goes into the `net.nevinsky.abyssus.*` packages (lib-core, lib-assets). `com.mbrlabs.mundus.*` is the
    legacy root that is being migrated, so do not add new subsystems there unless the change is about that code.
  - Spring is allowed in app-editor only. lib-commons, lib-core and lib-assets must stay free of Spring and of
    editor code, because lib-commons is meant to be usable in games.
  - lib-assets and lib-core must not need an OpenGL context for loading (ModelData is built without one).

  Shaders
  - The editor runs on libGDX's default legacy GL 2.1 context: GLSL 110 (`attribute`, `varying`, `texture2D`, no
    `#version`, no `mat3(mat4)`). Shaders are not compatible with a GL 3 core profile, and porting them is its own
    change.
  - `lib-core/src/main/resources/shader` is the single source of truth for the default and PBR GLSL. The bundled
    copies under `projects/app-editor/assets/bundled/shaders` are generated by
    `./gradlew :app-editor:syncBundledShaders`. Never hand-edit a copy. `BundledShadersInSyncTest` fails on drift.

  Data and compatibility
  - Save-file formats (scene and project JSON, asset meta) change freely. Backward compatibility and migrations are
    not a goal, so do not plan migration tasks or compatibility shims.

# Per-artifact rules, distilled from how the existing changes in openspec/changes are written.
rules:
  proposal:
    - Back every claim about current behavior with a `file:line` reference. Mark anything not verified as an assumption.
    - Always list what is out of scope, including defects found on the way that are deliberately not fixed.
    - State the risk and which modules and files are touched.
  design:
    - Say which module owns each new piece and check it against the module rules in the project context.
    - Record rejected alternatives with the reason, in particular when a library was considered but cannot be reused
      (for example gdx-gltf shaders extend libGDX's own DefaultShader, which this project replaces).
  specs:
    - Requirements about rendering or UI must name the verification route (test, shader check, or manual step).
  tasks:
    - Every task ends with a concrete verification (a command or a file/line to check), not "works as expected".
    - Put the tests for a behavior in the same task as the behavior.
    - A task that changes GLSL includes the sync and shader check commands from the project context.

operations:
  apply:
    guidance:
      - Run `./gradlew check` before marking a task done. If GLSL changed, also run `:lib-core:shaderCheck`.
      - Do not report a check as passed if it was skipped. Say which checks were not run, for example when no display
        is available for the shader check.
      - Do not commit unless asked to.
  archive:
    guidance:
      - Summarize what was delivered, what was deliberately left out, and which checks were run.
